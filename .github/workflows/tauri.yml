name: Tauri build

on:
  push:
    branches: [main]
    # A v* tag publishes a GitHub release with the installers.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            bin: tauride
            bundles: deb,rpm,appimage
          - os: windows-latest
            name: windows-x64
            bin: tauride.exe
            bundles: nsis,msi
          - os: macos-latest
            name: macos-arm64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    env:
      # Only the Electron build needs Electron itself.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          # mk derives the version from the commit count.
          fetch-depth: 0

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev patchelf xvfb xclip libxkbcommon-dev dbus-daemon gdb

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Tauri test app
        run: npm run test:build

      - name: Tauri connection tests
        if: runner.os == 'Linux'
        env:
          RIDE_TEST_BINARY: src-tauri/target/ui-tests/debug/tauride
          RIDE_TEST_DEBUG_STARTUP: '1'
        run: xvfb-run --auto-servernum dbus-run-session -- node tools/test-tauri.js test/cn.js test/ci-input-probe.js --match=cn-app-starts-ok --match=cn-fav-* --match=ci-input-*

      # Runs beforeBuildCommand (npm run css && node tauri/stage.js) first.
      # tauri.bundle.conf.json turns bundling on for CI only.
      - name: Build
        run: npx --yes @tauri-apps/cli@2.12.1 build --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}

      # The macOS app ships inside the dmg, so it has no bare binary.
      - if: matrix.bin
        uses: actions/upload-artifact@v6
        with:
          name: tauride-${{ matrix.name }}
          path: src-tauri/target/release/${{ matrix.bin }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: tauride-${{ matrix.name }}-installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Zero-footprint Ride: the tree an interpreter serves from [DYALOG]/RIDEapp.
  zf:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run css

      - run: npm run test:unit

      - run: node mk zf

      # Loads the bundle in the runner's preinstalled Chrome.
      - run: node tools/zf-smoke.js _/zf

      - uses: actions/upload-artifact@v6
        with:
          name: tauride-zf
          path: _/tauride-zf-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, zf]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: tauride-*-installers
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          name: tauride-zf
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Each artifact keeps its bundle subfolder.
          find dist -type f -print
          find dist -type f -print0 | xargs -0 gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Tauride ${TAG#v}" --generate-notes
