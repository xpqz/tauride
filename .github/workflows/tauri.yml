name: Tauri build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            bin: ride
            bundles: deb,rpm,appimage
          - os: windows-latest
            name: windows-x64
            bin: ride.exe
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    env:
      # Only the Electron build needs Electron itself.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          # mk derives the version from the commit count.
          fetch-depth: 0

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Runs beforeBuildCommand (npm run css && node tauri/stage.js) first.
      # tauri.bundle.conf.json turns bundling on for CI only.
      - name: Build
        run: npx --yes @tauri-apps/cli@2.12.1 build --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v6
        with:
          name: ride-tauri-${{ matrix.name }}
          path: src-tauri/target/release/${{ matrix.bin }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: ride-tauri-${{ matrix.name }}-installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
