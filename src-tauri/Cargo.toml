[package]
name = "ride"
version = "4.8.0"
description = "Ride: remote IDE for Dyalog APL (Tauri shell)"
edition = "2021"
license = "MIT"

[lib]
name = "ride_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
