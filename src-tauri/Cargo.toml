[package]
name = "tauride"
version = "4.8.0"
description = "Ride: remote IDE for Dyalog APL (Tauri shell)"
edition = "2021"
license = "MIT"

[lib]
name = "ride_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.15.0"
percent-encoding = "2.3.2"
tokio = { version = "1.53.2", features = ["net", "io-util", "sync", "process", "rt", "macros", "time"] }
base64 = "0.23.1"
libc = "0.2.190"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8.4"
x509-parser = "0.18.1"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.17", default-features = false }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
rfd = { version = "0.17", default-features = false }
