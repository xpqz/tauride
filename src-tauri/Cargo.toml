[package]
name = "ride"
version = "4.8.0"
description = "Ride: remote IDE for Dyalog APL (Tauri shell)"
edition = "2021"
license = "MIT"

[lib]
name = "ride_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.15.0"
percent-encoding = "2.3.2"
tokio = { version = "1.53.2", features = ["net", "io-util", "sync", "process", "rt", "macros", "time"] }
base64 = "0.23.1"
libc = "0.2.190"
